<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGOR-VIDEO EDITOR</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { 
      --bg: #070707; 
      --panel: #0d0d0d; 
      --card: #111111; 
      --text: #f1f1ef; 
      --acid: #00f0ff; 
      --f-mono: "DM Mono", monospace; 
      --f-sans: "Inter", sans-serif; 
    }
    body { background: var(--bg); color: var(--text); font-family: var(--f-sans); overflow-x: hidden; position: relative; }

    /* Animação de Fundo (Partículas sutis) */
    body::after {
      content: "";
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.03) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Aberração Cromática Estática */
    .chromatic-text {
      position: relative;
      display: inline-block;
      text-shadow: 3px 0 0 rgba(255, 0, 85, 0.5), -3px 0 0 rgba(0, 255, 255, 0.5);
    }

    a { text-decoration: none; color: inherit; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    .mono { font-family: var(--f-mono); letter-spacing: 0.06em; }

    .nav { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 1.3rem clamp(1.2rem, 4vw, 3.5rem); border-bottom: 1px solid #242424; }
    .brand { font-weight: 800; font-size: 1.1rem; text-transform: uppercase; }
    .brand span { color: var(--acid); }

    .hero { position: relative; z-index: 10; padding: 4rem clamp(1.2rem, 4vw, 3.5rem); max-width: 1200px; margin: 0 auto; }
    .hero-title { font-size: clamp(3rem, 8vw, 6rem); font-weight: 900; line-height: 1; text-transform: uppercase; margin-bottom: 2rem; }
    .hero-text { max-width: 600px; color: #888; font-size: 1.1rem; line-height: 1.6; }
    
    /* Demais estilos mantidos para consistência... */
    .showcase, .work, .shorts, .contact { position: relative; z-index: 10; padding: 4rem clamp(1.2rem, 4vw, 3.5rem); max-width: 1200px; margin: 0 auto; }
    .btn-outline { border: 1px solid var(--acid); color: var(--acid); padding: 0.9rem 1.6rem; font-size: 0.75rem; text-transform: uppercase; cursor: pointer; }
    .card { border: 1px solid #242424; background: var(--card); padding: 1rem; margin-bottom: 1rem; cursor: pointer; }
    .footer { text-align: center; padding: 3rem; font-size: 0.7rem; color: #444; }

  </style>
</head>
<body>

  <header class="nav">
    <a class="brand" href="#top">IGOR-VIDEO EDITOR<span>.</span></a>
  </header>

  <main>
    <section class="hero">
      <h1 class="hero-title"><span class="chromatic-text" id="el-hero-name">IGOR AUGUSTO</span></h1>
      <p class="hero-text" id="el-hero-desc"></p>
    </section>

    <section class="showcase" id="showcase">
      <h2 id="showcaseTitle"></h2>
      <p style="color:#666; margin-bottom: 2rem;" id="showcaseNote"></p>
      <button class="btn-outline" id="btnShowcase">SHOWCASE ↗</button>
    </section>
  </main>

  <script id="data-script">
    const SITE_CONTENT = {
      "heroName": "IGOR AUGUSTO",
      "heroDesc": "Video editor focused on suspense, storytelling and documentary content. I create edits built around pacing, atmosphere and visual storytelling."
    };
    const SHOWCASE_VIDEO = {
      "id": "showcase-main",
      "title": "WHAT I DO IN PRACTICE",
      "description": "A visual showcase of my motion design, 3D animation and visual effects.",
      "source": { "type": "youtube", "videoId": "" }
    };
  </script>

  <script id="logic-script">
    document.getElementById("el-hero-name").textContent = SITE_CONTENT.heroName;
    document.getElementById("el-hero-name").setAttribute("data-text", SITE_CONTENT.heroName);
    document.getElementById("el-hero-desc").textContent = SITE_CONTENT.heroDesc;
    document.getElementById("showcaseTitle").textContent = SHOWCASE_VIDEO.title;
    document.getElementById("showcaseNote").textContent = SHOWCASE_VIDEO.description;
  </script>

  <!-- Painel Admin (Oculto) -->
  <script id="admin-script">
    (function() {
      const btn = document.createElement("button");
      btn.innerHTML = "⚙️ CONFIG";
      btn.style.cssText = "position:fixed; bottom:10px; left:10px; background:#00f0ff; padding:5px; font-size:10px; z-index:9999;";
      document.body.appendChild(btn);
      btn.onclick = () => alert("Painel ativo.");
    })();
  </script>
</body>
</html>
